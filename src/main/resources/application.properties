spring.application.name=multitenancy-system

# ENV File Load
spring.config.import=optional:file:.env[.properties]

# PostgreSQL Connection Settings
#spring.datasource.url=jdbc:postgresql://167.71.216.196:5432/db_tenant
#spring.datasource.username={}
#spring.datasource.password={}
spring.datasource.url=${URL_DATABASE}

# Driver and Dialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate Action (create, update, validate)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

#Security
spring.security.user.name=${SECURITY_USER_NAME}
spring.security.user.password=${SECURITY_PASSWORD}
security.api.key=${AUTH_TOKEN}

#DefaultEndpoint
server.servlet.context-path=/api/multi-tenancy

spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true