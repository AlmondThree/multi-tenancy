spring.application.name=multitenancy-system

# ENV File Load
spring.config.import=optional:file:.env[.properties]

# PostgreSQL Connection Settings
#spring.datasource.url=jdbc:postgresql://167.71.216.196:5432/db_tenant
#spring.datasource.username={}
#spring.datasource.password={}
spring.datasource.url=${URL_DATABASE}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# PostgreSQL Cashier Database
#app.datasource.db.cashier.jdbc-url=${URL_DATABASE_CASHIER}
#app.datasource.db.cashier.username=${USERNAME_CASHIER}
#app.datasource.db.cashier.password=${PASSWORD_CASHIER}

# PostgreSQL Cashier Database
#app.datasource.db.inventory.jdbc-url=${URL_DATABASE_INVENTORY}
#app.datasource.db.inventory.username=${USERNAME_INVENTORY}
#app.datasource.db.inventory.password=${PASSWORD_INVENTORY}

# Driver and Dialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate Action (create, update, validate)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

#Security
spring.security.user.name=${SECURITY_USER_NAME}
spring.security.user.password=${SECURITY_PASSWORD}
security.api.key=${AUTH_TOKEN}

#DefaultEndpoint
server.servlet.context-path=/api/multi-tenancy

spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true

spring.flyway.enable=true